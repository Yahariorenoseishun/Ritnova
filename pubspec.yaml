name: ritnova
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  audioplayers: ^6.8.1
  flame: ^1.38.2
  flame_audio: ^2.12.2
  flutter:
    sdk: flutter
  google_fonts: ^9.0.0
  material_ui: ^1.6.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1  

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/google_fonts/
    - assets/niveles/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/ritnova_lg.png"
  min_sdk_android: 21